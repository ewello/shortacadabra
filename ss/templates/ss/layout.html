{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortacadabra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bw-black: #0a0a0a;
            --bw-dark: #121212;
            --bw-surface: #161616;
            --bw-card: #1c1c1c;
            --bw-border: #2a2a2a;
            --bw-muted: #a3a3a3;
            --bw-text: #e6e6e6;
            --bw-text-dim: #bdbdbd;
            --bw-glow: rgba(255, 255, 255, 0.08);
            --accent-offwhite: #f0f0f0; /* near-white, not pure FFFFFF */
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #111 0%, var(--bw-dark) 50%, var(--bw-surface) 100%);
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            color: var(--bw-text);
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,255,255,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: backgroundShift 20s ease-in-out infinite;
        }
        
        @keyframes backgroundShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        .navbar {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
            box-shadow: 0 4px 20px var(--bw-glow);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--bw-border);
        }
        
        .navbar-brand, .navbar-nav .nav-link, .navbar-nav .dropdown-item {
            color: #fff !important;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }
        
        .navbar-brand {
            font-size: 1.5rem;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .navbar-nav .nav-link {
            transition: all 0.3s ease;
            position: relative;
        }
        
        .navbar-nav .nav-link:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .navbar-nav .nav-link.active {
            text-decoration: underline;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .main-content {
            padding: 32px 0 48px 0;
            position: relative;
            z-index: 1;
        }
        
        .card {
            border-radius: 20px;
            background: linear-gradient(145deg, var(--bw-card) 0%, rgba(22, 22, 22, 0.85) 100%);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 0 0 1px var(--bw-border),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 0 1px var(--bw-border),
                0 0 20px var(--bw-glow);
        }
        
        .card-title {
            color: var(--bw-text);
            font-weight: 600;
        }
        
        .card-text {
            color: var(--bw-text-dim);
        }

        /* Force all primary blocks to black background with white text */
        .card,
        .card .card-body,
        .card-header,
        .list-group-item,
        .alert,
        .table,
        .table thead th,
        .table tbody td {
            background-color: #0f0f0f !important;
            color: var(--accent-offwhite) !important;
            border-color: var(--bw-border) !important;
        }

        /* Ensure muted text inside dark blocks is also light */
        .card .text-muted,
        .list-group-item .text-muted,
        .alert .text-muted,
        .table .text-muted {
            color: var(--accent-offwhite) !important;
        }

        /* Links inside dark blocks */
        /* Links inside dark cards */
        .card a,
        .card .card-body a {
            color: var(--accent-offwhite) !important;
            text-decoration: none;
        }
        .card a:hover,
        .card .card-body a:hover {
            color: #ffffff !important;
            text-decoration: underline;
        }

        /* Card headers: ensure white text on dark background */
        .card-header {
            background: rgba(24, 24, 24, 0.85);
            color: var(--accent-offwhite) !important;
            border-bottom: 1px solid var(--bw-border);
        }
        .card .card-header span,
        .card .card-header a {
            color: var(--accent-offwhite) !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #111 0%, #222 100%);
            border: 1px solid var(--bw-border);
            border-radius: 12px;
            font-weight: 500;
            padding: 12px 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--bw-glow);
            color: var(--bw-text);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--bw-glow);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #111 0%, #222 100%);
            border: 1px solid var(--bw-border);
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 4px 15px var(--bw-glow);
            color: var(--bw-text);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #111 0%, #222 100%);
            border: 1px solid var(--bw-border);
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 4px 15px var(--bw-glow);
            color: var(--bw-text);
        }
        
        .form-control {
            background: rgba(24, 24, 24, 0.85);
            border: 1px solid var(--bw-border);
            border-radius: 12px;
            color: var(--bw-text);
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background: rgba(20, 20, 20, 0.95);
            border-color: #444;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
            color: var(--bw-text);
        }
        
        .form-control::placeholder {
            color: var(--bw-text-dim);
        }

        /* Make custom domain select black with white text */
        select.form-select, .form-select {
            background-color: #1a1a1a !important; /* lighter dark */
            color: var(--accent-offwhite) !important;
            border: 1px solid var(--bw-border) !important;
        }
        .form-select:focus {
            background-color: #202020 !important; /* slightly lighter on focus */
            color: var(--accent-offwhite) !important;
            border-color: #444 !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05) !important;
        }
        
        .footer {
            background: linear-gradient(135deg, #0f0f0f 0%, #151515 100%);
            color: #fff;
            padding: 24px 0 12px 0;
            text-align: center;
            margin-top: 48px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px var(--bw-glow);
        }
        
        .footer a { 
            color: var(--bw-text-dim); 
            text-decoration: underline; 
            transition: all 0.3s ease;
        }
        
        .footer a:hover { 
            color: #fff; 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        }
        
        /* Dark list groups with links */
        .list-group {
            background: transparent;
        }
        .list-group-item {
            background: var(--bw-surface);
            color: var(--accent-offwhite) !important;
            border-color: var(--bw-border);
        }
        .list-group-item .stretched-link,
        .list-group-item a,
        .list-group-item span,
        .list-group-item .badge {
            color: var(--accent-offwhite) !important;
            text-decoration: none;
        }
        .list-group-item-action:hover,
        .list-group-item-action:focus {
            background: #1f1f1f;
            color: #fff;
        }
        .list-group-item + .list-group-item {
            border-top-color: var(--bw-border);
        }

        /* Shoegaze floating elements */
        .floating-element {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: float 15s ease-in-out infinite;
        }
        
        .floating-element:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }
        
        .floating-element:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.6; }
        }
        
        /* Glitch effect for special elements */
        .glitch {
            position: relative;
            animation: glitch 2s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                Shortacadabra
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'urls' %}active{% endif %}" href="{% url 'urls' %}">Мои ссылки</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'shorten' %}active{% endif %}" href="{% url 'shorten' %}">Сократить</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'domains' %}active{% endif %}" href="{% url 'domains' %}">Домены</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Выйти</a>
                    </li>
                    {% else %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Аккаунт
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" style="color: #212529 !important;" href="{% url 'login' %}">Войти</a></li>
                            <li><a class="dropdown-item" style="color: #212529 !important;" href="{% url 'register' %}">Зарегистрироваться</a></li>
                            <li><hr class="dropdown-divider"></li>
                        </ul>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container main-content">
        {% block body %}{% endblock %}
    </main>
    <!-- Футер удалён по просьбе пользователя -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
