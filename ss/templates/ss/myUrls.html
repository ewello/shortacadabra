{% extends "ss/layout.html" %}
{% block body %}
<div class="list-group">
    {%for url in urls%}
    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div class="text-truncate" style="max-width: 60%;">
            {{ url.url }}
        </div>
        <div class="btn-group" role="group">
            <a href="{% url 'url' url.id %}" class="btn btn-outline-secondary btn-sm">Подробнее</a>
            <a href="{% url 'analytics' url.id %}" class="btn btn-outline-info btn-sm">Аналитика</a>
        </div>
    </div>
    {%empty%}
    <div class="alert alert-dark" role="alert">
        Вы еще не сократили ни одного url!!!
    </div>
    {%endfor%}
</div>
{% endblock %}
